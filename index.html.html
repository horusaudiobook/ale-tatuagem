<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Busque designs de tatuagem no Pinterest e agende sua tattoo com Alê Tatuagem">
  <title>Buscar Design de Tatuagem | Alê Tatuagem</title>
  <style>
    /* ===== RESET & ROOT ===== */
    :root {
      --preto-profundo: #0a0a0a;
      --preto-carvão: #1a1a1a;
      --cinza-escuro: #2d2d2d;
      --cinza-medio: #4a4a4a;
      --cinza-claro: #666666;
      --cinza-suave: #8a8a8a;
      --branco-puro: #ffffff;
      --branco-gelo: #f8f8f8;
      --verde-whatsapp: #25D366;
      --verde-whatsapp-dark: #128C7E;
      --sombra-suave: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: 
        radial-gradient(circle at 20% 80%, rgba(42, 42, 42, 0.8) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(35, 35, 35, 0.6) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(28, 28, 28, 0.4) 0%, transparent 50%),
        linear-gradient(135deg, var(--preto-profundo) 0%, var(--preto-carvão) 50%, var(--preto-profundo) 100%);
      color: var(--branco-gelo);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.6;
      padding: 1rem;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== FUNDO COM RESPINHOS ===== */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(74, 74, 74, 0.1) 0%, transparent 20%),
        radial-gradient(circle at 90% 30%, rgba(74, 74, 74, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 30% 70%, rgba(74, 74, 74, 0.12) 0%, transparent 30%),
        radial-gradient(circle at 70% 80%, rgba(74, 74, 74, 0.09) 0%, transparent 22%);
      pointer-events: none;
      z-index: -1;
    }

    /* ===== CONTAINER PRINCIPAL ===== */
    .main-container {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      max-height: 100vh;
      overflow-y: auto;
      padding: 0.5rem 0;
    }

    .main-container::-webkit-scrollbar {
      width: 4px;
    }

    .main-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .main-container::-webkit-scrollbar-thumb {
      background: var(--cinza-escuro);
      border-radius: 10px;
    }

    /* ===== HEADER ===== */
    header {
      text-align: center;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.6rem;
      font-weight: 300;
      color: var(--branco-puro);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      margin-bottom: 0.25rem;
    }

    .logo-icon {
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: var(--cinza-suave);
      font-size: 0.9rem;
    }

    /* ===== SEÇÃO DE BUSCA ===== */
    .search-section {
      width: 100%;
    }

    #searchForm {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .input-group {
      position: relative;
    }

    .input-group .search-icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      opacity: 0.5;
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      padding: 0.9rem 1.2rem 0.9rem 3.2rem;
      font-size: 1rem;
      border: 1px solid var(--cinza-escuro);
      border-radius: 16px;
      background: rgba(26, 26, 26, 0.8);
      color: var(--branco-gelo);
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    input[type="search"]:focus {
      outline: none;
      border-color: var(--cinza-suave);
      box-shadow: 0 0 0 3px rgba(138, 138, 138, 0.2);
      background: rgba(26, 26, 26, 0.9);
    }

    input[type="search"]::placeholder {
      color: var(--cinza-suave);
      opacity: 0.7;
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem;
      font-size: 1rem;
      background: linear-gradient(135deg, var(--cinza-medio), var(--cinza-escuro));
      color: var(--branco-puro);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--cinza-escuro), var(--cinza-medio));
      transform: translateY(-2px);
      box-shadow: var(--sombra-suave);
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    /* ===== SUGESTÕES ===== */
    .suggestions {
      margin-top: 0.8rem;
      text-align: center;
    }

    .suggestions p {
      color: var(--cinza-suave);
      font-size: 0.8rem;
      margin-bottom: 0.6rem;
    }

    .suggestions-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .tag {
      background: rgba(74, 74, 74, 0.3);
      border: 1px solid var(--cinza-escuro);
      padding: 0.4rem 0.9rem;
      border-radius: 30px;
      font-size: 0.8rem;
      color: var(--branco-gelo);
      cursor: pointer;
      transition: all 0.3s ease;
      user-select: none;
    }

    .tag:hover {
      background: var(--cinza-medio);
      transform: translateY(-2px);
      border-color: var(--cinza-suave);
    }

    .tag:active {
      transform: translateY(0);
    }

    /* ===== BOTÕES DE CONTATO ===== */
    .contact-icons {
      margin: 0.5rem 0;
      display: flex;
      gap: 1.8rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .contact-icons a,
    .share-btn {
      background: linear-gradient(135deg, var(--cinza-escuro), var(--cinza-medio));
      border-radius: 50%;
      padding: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      border: 2px solid var(--cinza-claro);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 65px;
      height: 65px;
      text-decoration: none;
      cursor: pointer;
    }

    .contact-icons a::before,
    .share-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent);
      border-radius: 50%;
    }

    .contact-icons img {
      width: 2.4rem;
      filter: brightness(0.9);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .share-btn svg {
      width: 2.2rem;
      height: 2.2rem;
      fill: var(--branco-gelo);
      transition: all 0.3s ease;
      position: relative;
      z-index: 1;
    }

    .contact-icons a:hover,
    .share-btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-color: var(--cinza-suave);
    }

    .contact-icons a:hover img {
      filter: brightness(1.2);
    }

    .share-btn:hover svg {
      fill: var(--branco-puro);
      transform: rotate(15deg);
    }

    /* ===== TOOLTIP ===== */
    .contact-icons a[aria-label] {
      position: relative;
    }

    .contact-icons a[aria-label]::after {
      content: attr(aria-label);
      position: absolute;
      bottom: -2.2rem;
      left: 50%;
      transform: translateX(-50%) scale(0.8);
      background: var(--preto-carvão);
      color: var(--branco-gelo);
      padding: 0.2rem 0.8rem;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      white-space: nowrap;
      border: 1px solid var(--cinza-escuro);
    }

    .contact-icons a[aria-label]:hover::after {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* ===== MODAL ===== */
    .share-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .share-modal.active {
      display: flex;
    }

    .share-content {
      background: rgba(26, 26, 26, 0.98);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: var(--sombra-suave);
      border: 1px solid var(--cinza-claro);
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
      animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .share-content .modal-icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    .share-content h3 {
      color: var(--branco-puro);
      margin-bottom: 1.5rem;
      font-weight: 500;
      letter-spacing: 1px;
    }

    .share-url {
      background: rgba(42, 42, 42, 0.8);
      border: 1px solid var(--cinza-escuro);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      color: var(--branco-gelo);
      word-break: break-all;
      font-size: 0.85rem;
    }

    .share-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .share-actions button {
      flex: 1;
      padding: 0.8rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, var(--cinza-medio), var(--cinza-escuro));
      color: var(--branco-gelo);
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .share-actions button:hover {
      background: linear-gradient(135deg, var(--cinza-escuro), var(--cinza-medio));
      transform: translateY(-2px);
    }

    .share-actions button:active {
      transform: translateY(0);
    }

    .close-share {
      position: absolute;
      top: 0.75rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--cinza-suave);
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.3s ease;
      padding: 0.25rem 0.5rem;
      line-height: 1;
    }

    .close-share:hover {
      color: var(--branco-puro);
      background: none;
      transform: none;
    }

    /* ===== RODAPÉ ===== */
    .copyright-footer {
      width: 100%;
      text-align: center;
      padding: 0.8rem;
      background: linear-gradient(90deg, transparent, rgba(26, 26, 26, 0.6), transparent);
      border-top: 1px solid var(--cinza-escuro);
      font-size: 0.75rem;
      color: var(--cinza-suave);
      letter-spacing: 0.5px;
      margin-top: 0.2rem;
    }

    .copyright-footer .heart {
      color: #ff4757;
      display: inline-block;
      animation: heartbeat 1.5s ease-in-out infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* ===== METAL TEXTURE ===== */
    .metal-texture {
      position: relative;
    }

    .metal-texture::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, 
        rgba(255, 255, 255, 0.03) 0%, 
        transparent 20%, 
        rgba(255, 255, 255, 0.05) 40%, 
        transparent 60%, 
        rgba(255, 255, 255, 0.02) 80%, 
        transparent 100%);
      pointer-events: none;
      border-radius: inherit;
    }

    /* ===== RESPONSIVIDADE ===== */
    @media (max-width: 480px) {
      body { padding: 0.75rem; }
      
      .main-container { gap: 0.8rem; }
      
      .logo { font-size: 1.3rem; }
      .logo-icon { font-size: 1.5rem; }
      .subtitle { font-size: 0.8rem; }
      
      .contact-icons { gap: 1.2rem; }
      
      .contact-icons a,
      .share-btn {
        width: 55px;
        height: 55px;
        padding: 12px;
      }
      
      .contact-icons img { width: 2rem; }
      .share-btn svg {
        width: 1.8rem;
        height: 1.8rem;
      }
      
      .tag {
        padding: 0.3rem 0.7rem;
        font-size: 0.7rem;
      }
      
      input[type="search"] {
        padding: 0.7rem 1rem 0.7rem 2.8rem;
        font-size: 0.9rem;
      }
      
      .input-group .search-icon { font-size: 1rem; }
      .btn-primary {
        padding: 0.7rem;
        font-size: 0.9rem;
      }
      
      .copyright-footer {
        font-size: 0.65rem;
        padding: 0.6rem;
      }

      .share-content { padding: 1.5rem; }
      .share-actions { flex-direction: column; }
    }

    @media (max-width: 360px) {
      .contact-icons a,
      .share-btn {
        width: 48px;
        height: 48px;
        padding: 10px;
      }
      
      .contact-icons img { width: 1.6rem; }
      .share-btn svg {
        width: 1.5rem;
        height: 1.5rem;
      }
      
      .contact-icons { gap: 0.8rem; }
    }

    @media (min-height: 800px) {
      .main-container {
        gap: 1.8rem;
      }
    }

    /* ===== UTILITÁRIOS ===== */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <!-- HEADER -->
    <header>
      <div class="logo">
        <span class="logo-icon">✒️</span>
        <span>Alê Tatuagem</span>
      </div>
      <p class="subtitle">Busque inspirações para sua próxima tatuagem</p>
    </header>

    <!-- SEARCH -->
    <main class="search-section">
      <form id="searchForm" role="search">
        <div class="input-group">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input 
            type="search" 
            id="searchTerm" 
            placeholder="Pesquisar um estilo..." 
            aria-label="Termo de busca para tatuagem"
            autocomplete="off"
          />
        </div>
        <button type="submit" class="btn-primary metal-texture">Pesquisar no Pinterest</button>
      </form>

      <!-- SUGESTÕES -->
      <div class="suggestions">
        <p>⬇︎ Sugestões populares ⬇︎</p>
        <div class="suggestions-tags">
          <span class="tag" data-search="leão">🦁 Leão</span>
          <span class="tag" data-search="fechamento">∞ Fechamento</span>
          <span class="tag" data-search="águia">🦅 Águia</span>
          <span class="tag" data-search="jesus">✝️ Jesus</span>
        </div>
      </div>
    </main>

    <!-- CONTATO -->
    <footer class="contact-icons">
      <a href="https://wa.me/559281708914" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="metal-texture">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp" loading="lazy" width="45" height="45">
      </a>
      <a href="https://www.instagram.com/ale.tatuagem/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" class="metal-texture">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733558.png" alt="Instagram" loading="lazy" width="45" height="45">
      </a>
      <div class="share-btn metal-texture" id="shareBtn" aria-label="Compartilhar site" role="button" tabindex="0">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
        </svg>
      </div>
    </footer>

    <!-- COPYRIGHT -->
    <div class="copyright-footer">
      &copy; 2017 Alê Tatuagem &mdash; Alessàndrho Peréira <span class="heart" aria-hidden="true">🦁</span>
    </div>
  </div>

  <!-- MODAL COMPARTILHAR -->
  <div class="share-modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle">
    <div class="share-content metal-texture">
      <button class="close-share" id="closeShare" aria-label="Fechar modal">&times;</button>
      <div class="modal-icon" aria-hidden="true">🔗</div>
      <h3 id="shareModalTitle">Compartilhar Site</h3>
      <div class="share-url" id="shareUrl" aria-label="Link do site"></div>
      <div class="share-actions">
        <button id="copyUrl">📋 Copiar Link</button>
        <button id="shareNative">📤 Compartilhar</button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // ===== ELEMENTOS =====
      const searchForm = document.getElementById('searchForm');
      const searchInput = document.getElementById('searchTerm');
      const shareBtn = document.getElementById('shareBtn');
      const shareModal = document.getElementById('shareModal');
      const closeShare = document.getElementById('closeShare');
      const shareUrl = document.getElementById('shareUrl');
      const copyUrl = document.getElementById('copyUrl');
      const shareNative = document.getElementById('shareNative');
      const suggestionTags = document.querySelectorAll('.tag');

      const currentUrl = window.location.href;

      // ===== FUNÇÃO DE BUSCA =====
      function searchTattoo(searchTermValue) {
        const searchTerm = searchTermValue.trim();
        
        if (!searchTerm) {
          alert('Por favor, digite um estilo de tatuagem!');
          searchInput.focus();
          return;
        }

        const pinterestUrl = `https://www.pinterest.com/search/pins/?q=${encodeURIComponent(`${searchTerm} tattoo`)}`;
        window.open(pinterestUrl, '_blank');
      }

      // ===== EVENTOS DE BUSCA =====
      searchForm.addEventListener('submit', (event) => {
        event.preventDefault();
        searchTattoo(searchInput.value);
      });

      searchInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          searchTattoo(searchInput.value);
        }
      });

      // ===== SUGESTÕES =====
      suggestionTags.forEach((tag) => {
        tag.addEventListener('click', () => {
          const searchValue = tag.getAttribute('data-search');
          searchInput.value = searchValue;
          searchTattoo(searchValue);
        });

        tag.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            tag.click();
          }
        });
        tag.setAttribute('role', 'button');
        tag.setAttribute('tabindex', '0');
      });

      // ===== MODAL DE COMPARTILHAR =====
      function openShareModal() {
        shareUrl.textContent = currentUrl;
        shareModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        setTimeout(() => closeShare.focus(), 100);
      }

      function closeShareModal() {
        shareModal.classList.remove('active');
        document.body.style.overflow = '';
        shareBtn.focus();
      }

      function copyToClipboard() {
        navigator.clipboard.writeText(currentUrl)
          .then(() => {
            alert('✅ Link copiado para a área de transferência!');
            closeShareModal();
          })
          .catch(() => {
            const textArea = document.createElement('textarea');
            textArea.value = currentUrl;
            document.body.appendChild(textArea);
            textArea.select();
            try {
              document.execCommand('copy');
              alert('✅ Link copiado para a área de transferência!');
              closeShareModal();
            } catch (err) {
              alert('❌ Erro ao copiar o link. Tente novamente.');
            }
            document.body.removeChild(textArea);
          });
      }

      function shareNativeFunction() {
        if (navigator.share) {
          navigator.share({
            title: 'Alê Tatuagem - Buscar Design de Tatuagem',
            text: 'Encontre inspirações incríveis para sua próxima tatuagem e agende com o Alê Tatuagem!',
            url: currentUrl,
          })
            .then(() => {
              console.log('Compartilhado com sucesso!');
              closeShareModal();
            })
            .catch((err) => {
              if (err.name !== 'AbortError') {
                console.error('Erro ao compartilhar:', err);
              }
            });
        } else {
          copyToClipboard();
        }
      }

      // ===== EVENTOS DO MODAL =====
      shareBtn.addEventListener('click', openShareModal);

      shareBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openShareModal();
        }
      });

      closeShare.addEventListener('click', closeShareModal);
      copyUrl.addEventListener('click', copyToClipboard);
      shareNative.addEventListener('click', shareNativeFunction);

      shareModal.addEventListener('click', (e) => {
        if (e.target === shareModal) {
          closeShareModal();
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && shareModal.classList.contains('active')) {
          closeShareModal();
        }
      });

      // ===== TRAP DE FOCO NO MODAL =====
      shareModal.addEventListener('keydown', (e) => {
        if (e.key === 'Tab') {
          const focusable = shareModal.querySelectorAll(
            'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
          );
          const firstFocusable = focusable[0];
          const lastFocusable = focusable[focusable.length - 1];

          if (e.shiftKey) {
            if (document.activeElement === firstFocusable) {
              e.preventDefault();
              lastFocusable.focus();
            }
          } else {
            if (document.activeElement === lastFocusable) {
              e.preventDefault();
              firstFocusable.focus();
            }
          }
        }
      });
    });
  </script>
</body>
</html>
